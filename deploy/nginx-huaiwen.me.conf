server {
    listen 80;
    listen [::]:80;
    server_name huaiwen.me www.huaiwen.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/huaiwen.me/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://huaiwen.me$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.huaiwen.me;

    ssl_certificate /etc/letsencrypt/live/huaiwen.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huaiwen.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://huaiwen.me$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name huaiwen.me;

    root /var/www/huaiwen.me/current;
    index index.html;

    access_log /var/log/nginx/huaiwen.me.access.log;
    error_log /var/log/nginx/huaiwen.me.error.log warn;

    ssl_certificate /etc/letsencrypt/live/huaiwen.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huaiwen.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    sendfile on;
    etag on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
        # For SPA routing, replace the line above with:
        # try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|ico|webp|avif|ttf|otf|woff|woff2)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
