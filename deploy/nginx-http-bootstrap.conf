server {
    listen 80;
    listen [::]:80;
    server_name huaiwen.me www.huaiwen.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/huaiwen.me/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        root /var/www/huaiwen.me/current;
        try_files $uri $uri/ =404;
    }
}
